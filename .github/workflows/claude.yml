name: Claude Code

# Claude builds when a PR comment mentions @claude (see AGENTS.md).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# One Claude run per PR at a time; a second @claude waits for the first.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          # Lets Claude set labels and mark the PR ready with gh.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE }}
          claude_args: |
            --max-turns 60
            --append-system-prompt "Before you finish, always end the round as AGENTS.md Build step 3 says, even if something is unfinished: update the PR description (tick met criteria, add a Verification section, list anything not done under Not done), then run gh pr ready and gh pr edit --add-label needs-review. Unfinished items go in the description; they never stop these steps."
            --allowedTools "Bash(npm ci),Bash(npm run:*),Bash(npm test),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr ready:*)"

      # Wakes Alice's review routine once, only when this round ended with
      # `needs-review`. Labels set with github.token can't trigger other
      # workflows, so the ping lives here instead of on a `labeled` event.
      - name: Ping Alice for review
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          WEBHOOK_URL: ${{ secrets.ALICE_REVIEW_WEBHOOK_URL }}
          WEBHOOK_AUTH: ${{ secrets.ALICE_REVIEW_WEBHOOK_AUTH }}
        run: |
          [ -n "$WEBHOOK_URL" ] || exit 0
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx needs-review; then
            curl -fsS -X POST "$WEBHOOK_URL" \
              -H "Authorization: $WEBHOOK_AUTH" \
              -H 'Content-Type: application/json' \
              -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"pr\":$PR}"
          fi
